services:
  api:
    image: ghcr.io/rodrigofurlaneti/syncbar-api:latest
    pull_policy: always 
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "${MYSQL_CONNECTION_STRING}"
      Jwt__Secret: "${Jwt__Secret}"
      Jwt__Issuer: "SyncBar"
      Jwt__Audience: "SyncBar.Client"
      Cors__AllowedOrigins__0: "http://localhost"
    ports:
      - "8080:8080"
    volumes:
      - syncbar-uploads:/app/wwwroot/uploads

  frontend:
    image: ghcr.io/rodrigofurlaneti/syncbar-frontend:latest
    pull_policy: always 
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "84:80"

volumes:
  syncbar-uploads:
