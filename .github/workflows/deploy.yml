name: Deploy to VM (Docker Compose)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rodrigofurlaneti/syncbar

jobs:

  # ============================================================
  # BUILD + PUSH GHCR
  # ============================================================

  build-and-push:
    name: Build & Push Images (GHCR)
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      contents: read
      packages: write

    steps:

      # Importante:
      # quando disparado por workflow_run, utiliza o commit
      # que realmente passou pelo CI.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ========================================================
      # API
      # ========================================================

      - name: Metadados da API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend/src
          file: ./backend/src/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ========================================================
      # FRONTEND
      # ========================================================

      - name: Metadados do Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ============================================================
  # DEPLOY VM
  # ============================================================

  deploy:
    name: Deploy via SSH (Nativo)

    needs:
      - build-and-push

    runs-on: ubuntu-latest

    steps:

      - name: Configurar e Executar Deploy na VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_ACTOR: ${{ github.actor }}

        run: |

          echo "=========================================="
          echo "CONFIGURANDO SSH"
          echo "=========================================="

          mkdir -p ~/.ssh

          echo "$VM_SSH_KEY" > ~/.ssh/id_rsa

          chmod 600 ~/.ssh/id_rsa

          cat >> ~/.ssh/config <<END
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          END


          echo "=========================================="
          echo "CONECTANDO NA VM"
          echo "=========================================="

          ssh "$VM_USER@$VM_HOST" << EOF

            set -e

            cd /opt/syncbarservice


            echo "=========================================="
            echo "LOGIN GHCR"
            echo "=========================================="

            echo "$GHCR_PAT" | sudo docker login ghcr.io \
              -u "$GH_ACTOR" \
              --password-stdin


            echo "=========================================="
            echo "BAIXANDO NOVAS IMAGENS"
            echo "=========================================="

            sudo docker compose pull


            echo "=========================================="
            echo "RECRIANDO CONTAINERS"
            echo "=========================================="

            sudo docker compose up -d --force-recreate


            echo "=========================================="
            echo "STATUS DOS CONTAINERS"
            echo "=========================================="

            sudo docker compose ps


            echo "=========================================="
            echo "LIMPANDO IMAGENS ANTIGAS"
            echo "=========================================="

            sudo docker image prune -f


            echo "=========================================="
            echo "HEALTH CHECK"
            echo "=========================================="

            sleep 5

            curl -fsS http://localhost:8080/health

            echo ""

            echo "=========================================="
            echo "DEPLOY CONCLUIDO COM SUCESSO"
            echo "=========================================="

          EOF
