name: Deploy to VM (Docker Compose)

on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # rodrigofurlaneti/syncbar

jobs:
  build-and-push:
    name: Build & Push Images (GHCR)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Build e Push da API ---
      - name: Metadados da API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend/src
          file: ./backend/src/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Build e Push do Frontend ---
      - name: Metadados do Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build e push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy via SSH (Nativo)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Configurar e Executar Deploy na VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          # 1. Configura a chave privada na máquina do GitHub Actions
          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. Ignora a confirmação de host seguro (prompt yes/no)
          cat >> ~/.ssh/config <<END
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          END
          
          # 3. Conecta na VM via SSH nativo e roda os comandos do Docker
          ssh $VM_USER@$VM_HOST << EOF
            set -e
            cd /opt/syncbarservice
            
            # Autentica no GHCR
            echo "$GHCR_PAT" | sudo docker login ghcr.io -u $GH_ACTOR --password-stdin
            
            # Baixa as imagens novas
            sudo docker compose pull
            
            # Derruba o compose atual e forca a parada de containers antigos/zumbis
            sudo docker compose down
            sudo docker rm -f syncbar-api || true
            sudo docker ps -q --filter "publish=84" | xargs -r sudo docker rm -f
            
            # Sobe os containers novos unificados
            sudo docker compose up -d
            
            # Limpa imagens antigas
            sudo docker image prune -f
            
            # Teste de saúde
            sleep 5
            curl -fsS http://localhost:84/health && echo " -> Sistema no ar e saudável!"
          EOF
