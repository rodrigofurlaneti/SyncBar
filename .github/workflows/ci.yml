name: CI

# Executa em pushes e pull requests para as branches principais
# e permite execução manual.
on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

  workflow_dispatch:

# Cancela execuções antigas do mesmo branch/PR
# quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"


# ============================================================
# BACKEND
# ============================================================

jobs:

  backend:
    name: Backend — build + testes (.NET 9)
    runs-on: ubuntu-latest

    # O contexto `secrets` não é reconhecido dentro de `if:` — só dentro de
    # `env:`/`with:`/`run:`. Por isso o token é exposto aqui como variável de
    # ambiente do job, e os `if:` das etapas do Sonar checam `env.SONAR_TOKEN`.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # SonarCloud precisa do histórico completo (blame) para calcular
          # "new code" e autoria das issues corretamente.
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Setup Java 17 (necessário para o dotnet-sonarscanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Instalar dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore SyncBar.sln

      # A partir daqui a análise do SonarCloud só roda se o secret
      # SONAR_TOKEN existir no repositório (evita falhar em forks/PRs
      # externos, que não têm acesso aos secrets).
      - name: Iniciar análise SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          dotnet-sonarscanner begin
          /k:"rodrigofurlaneti_SyncBar"
          /o:"rodrigofurlaneti"
          /d:sonar.token="${{ env.SONAR_TOKEN }}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.cobertura.reportsPaths="**/TestResults/**/coverage.cobertura.xml"
          /d:sonar.coverage.exclusions="**/Migrations/**"

      - name: Build (Release)
        run: dotnet build SyncBar.sln --no-restore --configuration Release -warnaserror

      - name: Testes unitários (com cobertura)
        run: >
          dotnet test test/SyncBar.Tests
          --no-build
          --configuration Release
          --settings coverage.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=unit.trx"

      - name: Testes de arquitetura
        run: >
          dotnet test test/SyncBar.ArchTests
          --no-build
          --configuration Release
          --logger "trx;LogFileName=arch.trx"

      - name: Testes BDD (Specs, com cobertura)
        run: >
          dotnet test test/SyncBar.Specs
          --no-build
          --configuration Release
          --settings coverage.runsettings
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=specs.trx"

      - name: Finalizar análise SonarCloud
        if: ${{ always() && env.SONAR_TOKEN != '' }}
        run: dotnet-sonarscanner end /d:sonar.token="${{ env.SONAR_TOKEN }}"

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/**/TestResults/*.trx
          if-no-files-found: warn


# ============================================================
# FRONTEND
# ============================================================

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck + build
        run: npm run build


# ============================================================
# DOCKER
# ============================================================

  docker:
    name: Docker — valida build das imagens
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imagem da API
        uses: docker/build-push-action@v6
        with:
          context: ./backend/src
          file: ./backend/src/Dockerfile
          push: false
          tags: syncbar-api:ci

      - name: Build imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: syncbar-frontend:ci