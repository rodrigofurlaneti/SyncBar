server {
    listen 80;
    listen 443 ssl;
    server_name 9.205.156.87;
    ssl_certificate /etc/letsencrypt/live/syncbar-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/syncbar-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    location / { try_files $uri $uri/ /index.html; }
    location = /health { proxy_pass http://api:8080/health; }
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /uploads/ {
        proxy_pass http://api:8080/uploads/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
